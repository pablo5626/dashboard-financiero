/* ── SVG Ring ─────────────────────────────────────────────── */
function Ring({p,size=68,sw=6,col}){
  const r=(size/2)-sw, circ=2*Math.PI*r, dash=circ-(p/100)*circ;
  const c=col||(p>=100?C.gr:p>=50?C.am:C.ac);
  return h('svg',{width:size,height:size,style:{flexShrink:0}},
    h('circle',{cx:size/2,cy:size/2,r,fill:'none',stroke:C.br,strokeWidth:sw}),
    h('circle',{cx:size/2,cy:size/2,r,fill:'none',stroke:c,strokeWidth:sw,
      strokeDasharray:circ,strokeDashoffset:dash,strokeLinecap:'round',
      transform:`rotate(-90 ${size/2} ${size/2})`,style:{transition:'stroke-dashoffset 0.6s ease'}}),
    h('text',{x:size/2,y:size/2+5,textAnchor:'middle',
      style:{fontSize:'12px',fontWeight:700,fill:c,fontFamily:'system-ui'}},`${p}%`)
  );
}

/* ── SVG AreaChart ────────────────────────────────────────── */
function AreaChart({data,xKey,yKey,color,ht=150}){
  if(!data||data.length<2) return null;
  const vals=data.map(d=>d[yKey]), maxV=Math.max(...vals)||1;
  const W=320, pl=48,pr=8,pt=8,pb=28, iW=W-pl-pr, iH=ht-pt-pb;
  const xs=data.map((_,i)=>pl+i/(data.length-1)*iW);
  const ys=data.map(d=>pt+iH-(d[yKey]/maxV*iH));
  const linePts=xs.map((x,i)=>`${x},${ys[i]}`).join(' ');
  const areaPts=[...xs.map((x,i)=>`${x},${ys[i]}`),`${pl+iW},${pt+iH}`,`${pl},${pt+iH}`].join(' ');
  const grid=[0.5,1].map(f=>h(Fragment,{key:f},
    h('line',{x1:pl,y1:pt+iH-f*iH,x2:pl+iW,y2:pt+iH-f*iH,stroke:C.br,strokeDasharray:'3 3'}),
    h('text',{x:pl-4,y:pt+iH-f*iH+4,textAnchor:'end',style:{fontSize:'9px',fill:C.mu}},fmtS(maxV*f))
  ));
  const showIdx=[0,...data.map((_,i)=>i).filter(i=>i>0&&i<data.length-1&&i%Math.ceil(data.length/3)===0),data.length-1];
  return h('svg',{viewBox:`0 0 ${W} ${ht}`,style:{width:'100%',height:`${ht}px`}},
    h('defs',null,h('linearGradient',{id:'ag'+color.replace('#',''),x1:'0',y1:'0',x2:'0',y2:'1'},
      h('stop',{offset:'0%',stopColor:color,stopOpacity:0.3}),
      h('stop',{offset:'100%',stopColor:color,stopOpacity:0.02})
    )),
    ...grid,
    h('polygon',{points:areaPts,fill:`url(#ag${color.replace('#','')})`}),
    h('polyline',{points:linePts,fill:'none',stroke:color,strokeWidth:2,strokeLinejoin:'round'}),
    ...xs.map((x,i)=>h('circle',{key:i,cx:x,cy:ys[i],r:3,fill:color})),
    ...[...new Set(showIdx)].map(i=>h('text',{key:i,x:xs[i],y:ht-6,textAnchor:'middle',
      style:{fontSize:'9px',fill:C.mu}},data[i][xKey]))
  );
}

/* ── SVG BarChart ─────────────────────────────────────────── */
function BarChart({data,xKey,yKey,color,ht=110}){
  if(!data||!data.length) return null;
  const vals=data.map(d=>d[yKey]), maxV=Math.max(...vals)||1;
  const W=320, pl=48,pr=8,pt=8,pb=28, iW=W-pl-pr, iH=ht-pt-pb;
  const bW=Math.max(4,iW/data.length*0.6);
  return h('svg',{viewBox:`0 0 ${W} ${ht}`,style:{width:'100%',height:`${ht}px`}},
    ...[0.5,1].map(f=>h(Fragment,{key:f},
      h('line',{x1:pl,y1:pt+iH-f*iH,x2:pl+iW,y2:pt+iH-f*iH,stroke:C.br,strokeDasharray:'3 3'}),
      h('text',{x:pl-4,y:pt+iH-f*iH+4,textAnchor:'end',style:{fontSize:'9px',fill:C.mu}},fmtS(maxV*f))
    )),
    ...data.map((d,i)=>{
      const x=pl+i/data.length*iW+(iW/data.length-bW)/2;
      const bH=d[yKey]/maxV*iH, y=pt+iH-bH;
      return h(Fragment,{key:i},
        h('rect',{x,y,width:bW,height:bH,fill:color,rx:3}),
        h('text',{x:x+bW/2,y:ht-6,textAnchor:'middle',style:{fontSize:'9px',fill:C.mu}},d[xKey])
      );
    })
  );
}

/* ── StatsModal (genérico) ────────────────────────────────── */
function StatsModal({nombre,fechaInicio,abonos,total,color,onClose,onDel}){
  const pag=abonos.reduce((s,a)=>s+a.monto,0);
  const sorted=[...abonos].sort((a,b)=>a.fecha.localeCompare(b.fecha));
  let ac=0;
  const dataAc=[{f:fmtSh(fechaInicio),v:0},...sorted.map(a=>{ac+=a.monto;return{f:fmtSh(a.fecha),v:ac};})];
  const dataBars=sorted.map(a=>({f:fmtSh(a.fecha),v:a.monto}));
  const montos=abonos.map(a=>a.monto);
  const prom=pag/abonos.length, maxV=Math.max(...montos), minV=Math.min(...montos);
  const dt=sorted.length>0?days(fechaInicio,sorted[sorted.length-1].fecha):0;
  const ritmo=sorted.length>1?days(sorted[0].fecha,sorted[sorted.length-1].fecha)/(sorted.length-1):null;
  const col=color||C.ac;
  return h(Modal,{title:'📊 Resumen estadístico',onClose},
    h('div',{style:{background:`linear-gradient(135deg,rgba(124,58,237,0.25),rgba(0,181,93,0.2))`,borderRadius:'16px',
      border:`1px solid ${C.br}`,
      padding:'20px',marginBottom:'20px',textAlign:'center'}},
      h('div',{style:{fontSize:'36px',marginBottom:'6px'}},'🎉'),
      h('h3',{style:{margin:'0 0 4px',fontSize:'18px',fontWeight:800,color:C.tx}},`¡${nombre} completado!`),
      h('p',{style:{margin:0,fontSize:'14px',color:C.mu}},`${fmt(pag)} en ${abonos.length} pagos. ¡Lo lograste! 💪`)
    ),
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'20px'}},
      ...[['Pago promedio',fmt(prom),col],['Pago mayor',fmt(maxV),C.gr],
        ['Pago menor',fmt(minV),C.am],['Días totales',dt===0?'Mismo día':`${dt} días`,C.tx],
        ritmo!=null?['Días entre pagos',`~${Math.round(ritmo)} días`,C.mu]:null,
        ['Total pagos',`${abonos.length} pagos`,C.tx]
      ].filter(Boolean).map(([l,v,c])=>h(StatBox,{key:l,label:l,value:v,color:c}))
    ),
    h('p',{style:{margin:'0 0 8px',fontSize:'11px',fontWeight:700,color:C.mu,textTransform:'uppercase'}},'Progreso acumulado'),
    h('div',{style:{background:C.card2,borderRadius:'14px',padding:'12px 8px 4px',marginBottom:'16px',border:`1px solid ${C.br}`}},
      h(AreaChart,{data:dataAc,xKey:'f',yKey:'v',color:col,ht:145})
    ),
    h('p',{style:{margin:'0 0 8px',fontSize:'11px',fontWeight:700,color:C.mu,textTransform:'uppercase'}},'Cada pago'),
    h('div',{style:{background:C.card2,borderRadius:'14px',padding:'12px 8px 4px',marginBottom:'20px',border:`1px solid ${C.br}`}},
      h(BarChart,{data:dataBars,xKey:'f',yKey:'v',color:C.gr,ht:110})
    ),
    h('button',{onClick:onDel,style:{width:'100%',padding:'12px',background:C.rdL,color:C.rd,
      border:'none',borderRadius:'14px',fontSize:'14px',fontWeight:700,cursor:'pointer'}},'Eliminar registro')
  );

  const relEmoji={amigo:'👫',familiar:'👨‍👩‍👧',compañero:'🤝',pareja:'💑',conocido:'🙋',otro:'👤'};
  const venceAlert=p.vence&&!done?diasVence(p.vence):null;
  return h(Modal,{title:`💙 ${p.persona}`,onClose},
    h('div',{style:{display:'flex',gap:'8px',alignItems:'center',flexWrap:'wrap',marginBottom:'14px',marginTop:'-8px'}},
      h('span',{style:{fontSize:'12px',fontWeight:700,background:C.blL,color:C.bl,borderRadius:'99px',padding:'3px 10px'}},
        `${relEmoji[p.relacion]||'👤'} ${p.relacion}`),
      h('span',{style:{fontSize:'12px',color:C.mu}},'Prestado el '+fmtD(p.fecha)),
      p.contacto&&h('span',{style:{fontSize:'12px',color:C.mu}},`📱 ${p.contacto}`)
    ),
    h('div',{style:{background:C.blL,borderRadius:'10px',padding:'10px 14px',marginBottom:venceAlert?'10px':'14px'}},
      h('p',{style:{margin:0,fontSize:'13px',color:C.bl}},`💬 Motivo: ${p.motivo}`)
    ),
    venceAlert&&h('div',{style:{background:C.orL,borderRadius:'10px',padding:'10px 14px',marginBottom:'14px'}},
      h('p',{style:{margin:0,fontSize:'13px',color:C.or,fontWeight:700}},`⏰ ${venceAlert}`)
    ),
    h('p',{style:{margin:'0 0 12px',fontSize:'14px',color:done?C.gr:C.bl,fontWeight:600}},motivP(pc)),
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginBottom:'14px'}},
      ...[['Prestado',fmt(p.monto),C.tx],['Recuperado',fmt(rec),C.gr],['Pendiente',fmt(rest),done?C.gr:C.bl]]
        .map(([l,v,c])=>h(StatBox,{key:l,label:l,value:v,color:c}))
    ),
    p.vence&&h('div',{style:{background:C.card2,border:`1px solid ${C.br}`,borderRadius:'10px',padding:'10px 14px',marginBottom:'14px'}},
      h('p',{style:{margin:0,fontSize:'12px',color:C.mu}},'📅 Fecha pactada de pago: '),
      h('p',{style:{margin:'2px 0 0',fontSize:'14px',fontWeight:700,color:C.tx}},fmtD(p.vence))
    ),
    h('div',{style:{marginBottom:'18px'}},
      h('div',{style:{height:'10px',background:C.br,borderRadius:'99px',overflow:'hidden'}},
        h('div',{style:{height:'100%',width:`${pc}%`,background:done?C.gr:C.bl,borderRadius:'99px',transition:'width 0.6s'}})
      ),
      h('p',{style:{margin:'5px 0 0',fontSize:'12px',color:C.mu,textAlign:'right'}},`${pc}% recuperado`)
    ),
    h('p',{style:{fontSize:'11px',fontWeight:700,color:C.mu,textTransform:'uppercase',letterSpacing:'0.05em',margin:'0 0 8px'}},
      `Abonos recibidos (${p.abonos.length})`),
    h('div',{style:{maxHeight:'160px',overflowY:'auto',marginBottom:'16px'}},
      p.abonos.length===0
        ?h('p',{style:{color:C.mu,fontSize:'14px',textAlign:'center',padding:'16px 0'}},'Sin pagos recibidos aún. 📭')
        :[...p.abonos].sort((a,b)=>b.fecha.localeCompare(a.fecha)).map(a=>
          h('div',{key:a.id,style:{display:'flex',justifyContent:'space-between',alignItems:'center',
            padding:'9px 0',borderBottom:`1px solid ${C.br}`}},
            h('div',null,
              h('p',{style:{margin:0,fontSize:'14px',fontWeight:700,color:C.gr}},`+${fmt(a.monto)}`),
              a.nota&&h('p',{style:{margin:'1px 0 0',fontSize:'12px',color:C.mu}},a.nota)
            ),
            h('p',{style:{margin:0,fontSize:'12px',color:C.mu}},fmtD(a.fecha))
          )
        )
    ),
    h('div',{style:{display:'flex',gap:'8px'}},
      done
        ?h('button',{onClick:onStats,style:{flex:1,padding:'12px',background:C.bl,color:'#fff',
            border:'none',borderRadius:'14px',fontSize:'14px',fontWeight:800,cursor:'pointer'}},'📊 Ver estadísticas')
        :h('button',{onClick:onAbono,style:{flex:1,padding:'12px',background:C.bl,color:'#fff',
            border:'none',borderRadius:'14px',fontSize:'14px',fontWeight:800,cursor:'pointer'}},'+ Registrar pago'),
      h('button',{onClick:onDel,style:{padding:'12px 16px',background:C.rdL,color:C.rd,
        border:'none',borderRadius:'14px',fontSize:'14px',fontWeight:700,cursor:'pointer'}},'🗑')
    )
  );
}

/* ── Tab ──────────────────────────────────────────────────── */
function Tab({label,active,onClick,badge}){
  return h('button',{onClick,style:{flex:1,padding:'10px 4px',border:'none',background:'none',
    cursor:'pointer',fontSize:'13px',fontWeight:active?800:600,
    color:active?C.hdr:C.mu,borderBottom:`3px solid ${active?C.ac:'transparent'}`,
    transition:'all 0.2s',position:'relative'}},
    label,
    badge>0&&h('span',{style:{position:'absolute',top:'6px',right:'14px',background:C.rd,color:'#fff',
      borderRadius:'99px',fontSize:'10px',fontWeight:700,padding:'1px 5px',minWidth:'16px',
      textAlign:'center'}},badge)
  );
}

/* ── App ──────────────────────────────────────────────────── */
function App(){
  const [data,setData]=useState(()=>load());
  const [tab,setTab]=useState('deudas');
  const [modal,setModal]=useState(null);
  const [sel,setSel]=useState(null);
  const [filtro,setFiltro]=useState('todas');

  const persist=useCallback(next=>{setData(next);save(next)},[]);
  const upD=d=>{setData(d);save(d);};

  /* deudas */
  const addDeuda=d=>upD({...data,deudas:[...data.deudas,d]});
  const addAbonoD=(id,a)=>upD({...data,deudas:data.deudas.map(d=>d.id===id?{...d,abonos:[...d.abonos,a]}:d)});
  const delDeuda=id=>{upD({...data,deudas:data.deudas.filter(d=>d.id!==id)});setModal(null);setSel(null);};

  /* préstamos */
  const addPrestamo=p=>upD({...data,prestamos:[...data.prestamos,p]});
  const addAbonoP=(id,a)=>upD({...data,prestamos:data.prestamos.map(p=>p.id===id?{...p,abonos:[...p.abonos,a]}:p)});
  const delPrestamo=id=>{upD({...data,prestamos:data.prestamos.filter(p=>p.id!==id)});setModal(null);setSel(null);};

  /* totales */
  const tDeudasTotal=data.deudas.reduce((s,d)=>s+d.total,0);
  const tDeudasPag  =data.deudas.reduce((s,d)=>s+d.abonos.reduce((a,b)=>a+b.monto,0),0);
  const tPrestTotal =data.prestamos.reduce((s,p)=>s+p.monto,0);
  const tPrestRec   =data.prestamos.reduce((s,p)=>s+p.abonos.reduce((a,b)=>a+b.monto,0),0);
  const netPos      =tPrestRec-tDeudasPag; // simplificado: récuperado - pagado
  const realNet     =tPrestTotal-tPrestRec-(tDeudasTotal-tDeudasPag); // me deben - debo

  const deudasActivas=data.deudas.filter(d=>d.abonos.reduce((s,a)=>s+a.monto,0)<d.total).length;
  const prestActivos =data.prestamos.filter(p=>p.abonos.reduce((s,a)=>s+a.monto,0)<p.monto).length;

  const selDeuda=sel?data.deudas.find(d=>d.id===sel.id)||sel:null;
  const selPrest=sel?data.prestamos.find(p=>p.id===sel.id)||sel:null;

  /* filtrar lista activa */
  const filterList=(list,keyMonto)=>list.filter(item=>{
    const p=item.abonos.reduce((s,a)=>s+a.monto,0);
    if(filtro==='activas') return p<item[keyMonto];
    if(filtro==='saldados') return p>=item[keyMonto];
    return true;
  });
  const visDedudas=filterList(data.deudas,'total');
  const visPrest  =filterList(data.prestamos,'monto');

  return h('div',{style:{minHeight:'100vh',background:C.bg}},
    /* ── HEADER ──────────────────────────────────────────── */
    h('div',{style:{background:'linear-gradient(180deg,#2d0c6b 0%,#101415 100%)',padding:'28px 20px 20px'}},
      h('p',{style:{margin:'0 0 2px',fontSize:'11px',fontWeight:700,color:'rgba(255,255,255,0.5)',textTransform:'uppercase',letterSpacing:'0.12em'}},'Mi cuaderno de cuentas'),
      h('h1',{style:{margin:'0 0 18px',fontSize:'26px',fontWeight:900,color:'#fff',lineHeight:1.1,fontFamily:"'Plus Jakarta Sans',sans-serif"}},'Finanzas personales 💜'),
      /* resumen 2x2 */
      h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px',marginBottom:'14px'}},
        ...[
          ['Debo',fmt(tDeudasTotal-tDeudasPag),C.rd,'📉'],
          ['Me deben',fmt(tPrestTotal-tPrestRec),C.gr,'📈'],
          ['Ya pagué',fmt(tDeudasPag),'rgba(255,255,255,0.75)','✅'],
          ['Recuperé',fmt(tPrestRec),'rgba(255,255,255,0.75)','💰'],
        ].map(([l,v,c,ic])=>h('div',{key:l,style:{background:'rgba(255,255,255,0.1)',borderRadius:'14px',padding:'12px 14px'}},
          h('p',{style:{margin:0,fontSize:'10px',color:'rgba(255,255,255,0.5)',fontWeight:700,textTransform:'uppercase'}},`${ic} ${l}`),
          h('p',{style:{margin:'3px 0 0',fontSize:'15px',fontWeight:800,color:c}},v)
        ))
      ),
      /* saldo neto */
      h('div',{style:{background:'rgba(255,255,255,0.08)',borderRadius:'14px',padding:'12px 16px',
        display:'flex',justifyContent:'space-between',alignItems:'center'}},
        h('p',{style:{margin:0,fontSize:'12px',color:'rgba(255,255,255,0.6)',fontWeight:700}},'Saldo neto (me deben − debo)'),
        h('p',{style:{margin:0,fontSize:'16px',fontWeight:900,color:realNet>=0?C.gr:C.rd}},
          `${realNet>=0?'+':''}${fmt(realNet)}`)
      )
    ),
    /* ── TABS ────────────────────────────────────────────── */
    h('div',{style:{background:C.card,display:'flex',borderBottom:`1px solid ${C.br}`,
      position:'sticky',top:0,zIndex:10}},
      h(Tab,{label:'💳 Mis deudas',active:tab==='deudas',onClick:()=>{setTab('deudas');setFiltro('todas');},badge:deudasActivas}),
      h(Tab,{label:'🤝 Préstamos',active:tab==='prestamos',onClick:()=>{setTab('prestamos');setFiltro('todas');},badge:prestActivos})
    ),
    /* ── CONTENT ─────────────────────────────────────────── */
    h('div',{style:{maxWidth:'520px',margin:'0 auto',padding:'16px 16px 90px'}},
      /* filtros */
      h('div',{style:{display:'flex',gap:'8px',marginBottom:'16px'}},
        ...[ ['todas','Todas'],['activas',tab==='deudas'?'Activas 🔴':'Pendientes 🔴'],['saldados',tab==='deudas'?'Saldadas ✅':'Recuperados ✅'] ]
          .map(([f,label])=>h('button',{key:f,onClick:()=>setFiltro(f),style:{padding:'7px 14px',borderRadius:'99px',border:`1px solid ${filtro===f?'transparent':C.br}`,
            background:filtro===f?C.ac:C.card,color:filtro===f?'#fff':C.mu,
            fontSize:'12px',fontWeight:700,cursor:'pointer',
            boxShadow:filtro===f?'0 2px 10px rgba(124,58,237,0.4)':'none'}},label))
      ),

      /* ── LISTA DEUDAS ── */
      tab==='deudas'&&(
        visDedudas.length===0
          ?h('div',{style:{textAlign:'center',padding:'48px 20px'}},
            h('div',{style:{fontSize:'44px',marginBottom:'12px'}},filtro==='saldados'?'🏆':'📒'),
            h('p',{style:{color:C.mu,fontSize:'15px',fontWeight:600,margin:'0 0 4px'}},
              filtro==='saldados'?'¡Sin deudas saldadas aún!':'¡Sin deudas!'),
            h('p',{style:{color:C.mu,fontSize:'13px'}},
              filtro==='saldados'?'Sigue abonando 💪':'Toca + para registrar una deuda.')
          )
          :h('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}},
            ...visDedudas.map(d=>{
              const pg=d.abonos.reduce((s,a)=>s+a.monto,0);
              const pc=pct(pg,d.total), done=pc>=100;
              const catColors={consumo:C.ac,inversión:C.gr,emergencia:C.rd,entretenimiento:C.am,viaje:C.bl,otro:C.mu};
              const barCol=catColors[d.categoria]||C.ac;
              return h('div',{key:d.id,onClick:()=>{setSel(d);setModal('detD');},
                style:{background:C.card,borderRadius:'16px',padding:'14px 16px',
                  boxShadow:'0 2px 12px rgba(0,0,0,0.35)',cursor:'pointer',
                  border:`1.5px solid ${done?C.grL:C.br}`,opacity:done?0.8:1}},
                h('div',{style:{display:'flex',alignItems:'center',gap:'12px'}},
                  h(Ring,{p:pc}),
                  h('div',{style:{flex:1,minWidth:0}},
                    h('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'2px'}},
                      h('p',{style:{margin:0,fontWeight:800,fontSize:'14px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},d.nombre),
                      done&&h('span',{style:{fontSize:'10px',background:C.grL,color:C.gr,borderRadius:'99px',padding:'2px 7px',fontWeight:700,flexShrink:0}},'✓ Saldada'),
                      d.categoria&&!done&&h('span',{style:{fontSize:'10px',background:C.acL,color:C.ac,borderRadius:'99px',padding:'2px 7px',fontWeight:700,flexShrink:0,textTransform:'capitalize'}},d.categoria)
                    ),
                    d.desc&&h('p',{style:{margin:'0 0 4px',fontSize:'11px',color:C.mu,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},d.desc),
                    h('div',{style:{display:'flex',gap:'8px'}},
                      h('span',{style:{fontSize:'12px',color:C.gr,fontWeight:700}},`✓ ${fmt(pg)}`),
                      !done&&h('span',{style:{fontSize:'12px',color:C.rd,fontWeight:700}},`↓ ${fmt(d.total-pg)}`)
                    )
                  )
                ),
                h('div',{style:{marginTop:'10px',height:'5px',background:C.br,borderRadius:'99px',overflow:'hidden'}},
                  h('div',{style:{height:'100%',width:`${pc}%`,background:done?C.gr:barCol,borderRadius:'99px',transition:'width 0.6s'}})
                ),
                h('p',{style:{margin:'4px 0 0',fontSize:'11px',color:C.mu}},motivD(pc))
              );
            })
          )
      ),

      /* ── LISTA PRÉSTAMOS ── */
      tab==='prestamos'&&(
        visPrest.length===0
          ?h('div',{style:{textAlign:'center',padding:'48px 20px'}},
            h('div',{style:{fontSize:'44px',marginBottom:'12px'}},filtro==='saldados'?'💯':'🤝'),
            h('p',{style:{color:C.mu,fontSize:'15px',fontWeight:600,margin:'0 0 4px'}},
              filtro==='saldados'?'¡Sin préstamos recuperados aún!':'¡Sin préstamos registrados!'),
            h('p',{style:{color:C.mu,fontSize:'13px'}},
              filtro==='saldados'?'Los préstamos recuperados aparecerán aquí 💪':'Toca + para registrar un préstamo.')
          )
          :h('div',{style:{display:'flex',flexDirection:'column',gap:'10px'}},
            ...visPrest.map(p=>{
              const rec=p.abonos.reduce((s,a)=>s+a.monto,0);
              const pc=pct(rec,p.monto), done=pc>=100;
              const relEmoji={amigo:'👫',familiar:'👨‍👩‍👧',compañero:'🤝',pareja:'💑',conocido:'🙋',otro:'👤'};
              const venceAlert=p.vence&&!done?diasVence(p.vence):null;
              return h('div',{key:p.id,onClick:()=>{setSel(p);setModal('detP');},
                style:{background:C.card,borderRadius:'16px',padding:'14px 16px',
                  boxShadow:'0 2px 12px rgba(0,0,0,0.35)',cursor:'pointer',
                  border:`1.5px solid ${done?C.grL:venceAlert?C.orL:C.br}`,opacity:done?0.8:1}},
                h('div',{style:{display:'flex',alignItems:'center',gap:'12px'}},
                  h(Ring,{p:pc,col:done?C.gr:C.bl}),
                  h('div',{style:{flex:1,minWidth:0}},
                    h('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'2px'}},
                      h('p',{style:{margin:0,fontWeight:800,fontSize:'14px',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},p.persona),
                      done&&h('span',{style:{fontSize:'10px',background:C.grL,color:C.gr,borderRadius:'99px',padding:'2px 7px',fontWeight:700,flexShrink:0}},'✓ Recuperado'),
                      h('span',{style:{fontSize:'10px',background:C.blL,color:C.bl,borderRadius:'99px',padding:'2px 7px',fontWeight:700,flexShrink:0}},
                        `${relEmoji[p.relacion]||'👤'} ${p.relacion}`)
                    ),
                    h('p',{style:{margin:'0 0 4px',fontSize:'11px',color:C.mu,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},`💬 ${p.motivo}`),
                    h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap'}},
                      h('span',{style:{fontSize:'12px',color:C.gr,fontWeight:700}},`✓ ${fmt(rec)}`),
                      !done&&h('span',{style:{fontSize:'12px',color:C.bl,fontWeight:700}},`⏳ ${fmt(p.monto-rec)}`),
                      venceAlert&&h('span',{style:{fontSize:'11px',color:C.or,fontWeight:700}},`⏰ ${venceAlert}`)
                    )
                  )
                ),
                h('div',{style:{marginTop:'10px',height:'5px',background:C.br,borderRadius:'99px',overflow:'hidden'}},
                  h('div',{style:{height:'100%',width:`${pc}%`,background:done?C.gr:C.bl,borderRadius:'99px',transition:'width 0.6s'}})
                ),
                h('p',{style:{margin:'4px 0 0',fontSize:'11px',color:C.mu}},motivP(pc))
              );
            })
          )
      )
    ),

    /* ── FAB ─────────────────────────────────────────────── */
    h('button',{onClick:()=>setModal(tab==='deudas'?'newD':'newP'),
      style:{position:'fixed',bottom:'24px',right:'24px',width:'58px',height:'58px',borderRadius:'50%',
        background:tab==='deudas'?C.ac:C.bl,color:'#fff',border:'none',fontSize:'28px',cursor:'pointer',
        boxShadow:`0 6px 24px ${tab==='deudas'?'rgba(124,58,237,0.5)':'rgba(127,209,255,0.35)'}`,
        display:'flex',alignItems:'center',justifyContent:'center'}},'+'),

    /* ── MODALS ──────────────────────────────────────────── */
    modal==='newD'&&h(NuevaDeuda,{onClose:()=>setModal(null),onSave:addDeuda}),
    modal==='newP'&&h(NuevoPrestamo,{onClose:()=>setModal(null),onSave:addPrestamo}),

    modal==='detD'&&selDeuda&&h(DetalleDeuda,{deuda:selDeuda,
      onClose:()=>{setModal(null);setSel(null);},
      onAbono:()=>setModal('aboD'),
      onDel:()=>delDeuda(selDeuda.id),
      onStats:()=>setModal('statD')}),

    modal==='aboD'&&selDeuda&&h(NuevoAbono,{
      titulo:`💳 Abonar a "${selDeuda.nombre}"`,
      rest:selDeuda.total-selDeuda.abonos.reduce((s,a)=>s+a.monto,0),
      onClose:()=>setModal('detD'),
      onSave:a=>{addAbonoD(selDeuda.id,a);setModal('detD');},
      color:C.gr}),

    modal==='statD'&&selDeuda&&h(StatsModal,{
      nombre:selDeuda.nombre,fechaInicio:selDeuda.fecha,
      abonos:selDeuda.abonos,total:selDeuda.total,color:C.ac,
      onClose:()=>setModal('detD'),onDel:()=>delDeuda(selDeuda.id)}),

    modal==='detP'&&selPrest&&h(DetallePrestamo,{p:selPrest,
      onClose:()=>{setModal(null);setSel(null);},
      onAbono:()=>setModal('aboP'),
      onDel:()=>delPrestamo(selPrest.id),
      onStats:()=>setModal('statP')}),

    modal==='aboP'&&selPrest&&h(NuevoAbono,{
      titulo:`💙 Pago de ${selPrest.persona}`,
      rest:selPrest.monto-selPrest.abonos.reduce((s,a)=>s+a.monto,0),
      onClose:()=>setModal('detP'),
      onSave:a=>{addAbonoP(selPrest.id,a);setModal('detP');},
      color:C.bl}),

    modal==='statP'&&selPrest&&h(StatsModal,{
      nombre:selPrest.persona,fechaInicio:selPrest.fecha,
      abonos:selPrest.abonos,total:selPrest.monto,color:C.bl,
      onClose:()=>setModal('detP'),onDel:()=>delPrestamo(selPrest.id)})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App,null));

</script>
</body>
</html>
