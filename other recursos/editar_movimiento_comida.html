      tags.forEach(tag => {
        tag.addEventListener('click', () => {
          if (!tag.querySelector('svg.w-3\\.5')) {
            tags.forEach(t => {
              t.classList.remove('bg-purple-950/60', 'border-purple-500/50', 'text-purple-200');
              t.classList.add('bg-surface-850', 'border-surface-800', 'text-slate-300');
            });
            tag.classList.add('bg-purple-950/60', 'border-purple-500/50', 'text-purple-200');
          }
        });
      });
    });
